name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests

      - name: Ruff proposal E5
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select E5

      - name: Ruff proposal W
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select W

      - name: Ruff proposal UP
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select UP

      - name: Ruff proposal B
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select B

      - name: Ruff proposal SIM
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select SIM

      - name: Ruff proposal RUF
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select RUF

      - name: Ruff proposal PTH
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select PTH

      - name: Ruff proposal PL
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select PL

      - name: Ruff proposal PERF
        continue-on-error: true
        run: .venv/bin/ruff check core/application/proposal_review_service.py --select PERF

      - name: Ruff remaining
        run: .venv/bin/ruff check main.py config core ui tests --exclude core/application/proposal_review_service.py

      - name: Pytest
        run: .venv/bin/python -m pytest
