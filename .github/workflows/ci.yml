name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests

      - name: Diagnose Ruff
        id: ruffdiag
        shell: bash
        run: |
          set +e
          .venv/bin/ruff check main.py config core ui tests --output-format=json > /tmp/ruff.json
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          findings = json.loads(Path("/tmp/ruff.json").read_text())
          if findings:
              first = findings[0]
              print(f"code={first['code']}")
              print(f"file={Path(first['filename']).name}")
              print(f"line={first['location']['row']}")
          else:
              print("code=clean")
              print("file=none")
              print("line=0")
          PY

      - name: Ruff ${{ steps.ruffdiag.outputs.code }} ${{ steps.ruffdiag.outputs.file }} line ${{ steps.ruffdiag.outputs.line }}
        if: steps.ruffdiag.outputs.code != 'clean'
        run: exit 1

      - name: Pytest
        if: steps.ruffdiag.outputs.code == 'clean'
        run: .venv/bin/python -m pytest
