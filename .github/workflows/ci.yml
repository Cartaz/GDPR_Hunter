name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-glx0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xkb1 \
            xvfb \
            xauth

      - name: Install
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests

      - name: Ruff
        run: .venv/bin/ruff check main.py config core ui tests

      - name: Pytest
        run: .venv/bin/python -m pytest

      - name: Dependency audit
        run: .venv/bin/pip-audit -r requirements.txt -r requirements-dev.txt
