name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests

      - name: Ruff main
        run: .venv/bin/ruff check main.py

      - name: Ruff proposal review service
        run: .venv/bin/ruff check core/application/proposal_review_service.py

      - name: Ruff bridge
        run: .venv/bin/ruff check ui/bridge.py

      - name: Ruff M13 tests
        run: .venv/bin/ruff check tests/test_m13_async_model_analysis.py

      - name: Ruff M14 tests
        run: .venv/bin/ruff check tests/test_m14_proposal_review.py

      - name: Ruff remaining
        run: .venv/bin/ruff check config core ui tests --exclude core/application/proposal_review_service.py --exclude ui/bridge.py --exclude tests/test_m13_async_model_analysis.py --exclude tests/test_m14_proposal_review.py

      - name: Pytest
        run: .venv/bin/python -m pytest
