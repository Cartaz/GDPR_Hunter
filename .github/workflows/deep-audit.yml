name: Deep Audit

on:
  workflow_dispatch:
  push:
    branches: [audit-m14-deep-review]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project and audit tools
        run: |
          chmod +x install.sh
          ./install.sh
          .venv/bin/python -m pip install vulture pyright pip-audit pytest-cov
      - name: Canonical compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests
      - name: Canonical Ruff
        run: .venv/bin/ruff check main.py config core ui tests
      - name: Canonical pytest
        run: .venv/bin/python -m pytest
      - name: Deprecation warnings as errors
        run: .venv/bin/python -W error::DeprecationWarning -m pytest

      - name: Diagnose Vulture
        id: vulture
        shell: bash
        run: |
          set +e
          .venv/bin/vulture main.py config core ui --min-confidence 80 > /tmp/vulture.txt 2>&1
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          lines = [line.strip() for line in Path('/tmp/vulture.txt').read_text().splitlines() if line.strip()]
          print(f"count={len(lines)}")
          first = lines[0].replace(' ', '_').replace(':', '-')[:140] if lines else 'clean'
          print(f"first={first}")
          PY
      - name: Vulture ${{ steps.vulture.outputs.count }} finding(s) first ${{ steps.vulture.outputs.first }}
        if: steps.vulture.outputs.count != '0'
        continue-on-error: true
        run: exit 1

      - name: Diagnose Pyright
        id: pyright
        shell: bash
        run: |
          set +e
          .venv/bin/pyright main.py config core ui --outputjson > /tmp/pyright.json
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from collections import Counter
          from pathlib import Path
          data = json.loads(Path('/tmp/pyright.json').read_text())
          diagnostics = data.get('generalDiagnostics', [])
          layers = Counter()
          for finding in diagnostics:
              relative = Path(finding.get('file', 'unknown')).as_posix()
              if '/core/' in relative:
                  layers['core'] += 1
              elif '/ui/' in relative:
                  layers['ui'] += 1
              elif '/config/' in relative:
                  layers['config'] += 1
              else:
                  layers['main'] += 1
          print(f"count={len(diagnostics)}")
          print(f"core={layers['core']}")
          print(f"ui={layers['ui']}")
          print(f"config={layers['config']}")
          print(f"main={layers['main']}")
          if diagnostics:
              first = diagnostics[0]
              path = Path(first.get('file', 'unknown')).name
              line = int(first.get('range', {}).get('start', {}).get('line', -1)) + 1
              rule = first.get('rule') or 'no-rule'
              print(f"first={path}-{line}-{rule}")
          else:
              print('first=clean')
          PY
      - name: Pyright total ${{ steps.pyright.outputs.count }} core ${{ steps.pyright.outputs.core }} ui ${{ steps.pyright.outputs.ui }} config ${{ steps.pyright.outputs.config }} main ${{ steps.pyright.outputs.main }} first ${{ steps.pyright.outputs.first }}
        if: steps.pyright.outputs.count != '0'
        continue-on-error: true
        run: exit 1

      - name: Ruff ALL production scan
        run: .venv/bin/ruff check main.py config core ui --select ALL
      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Coverage
        id: coverage
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest --cov=main --cov=config --cov=core --cov=ui --cov-report=term > /tmp/coverage.txt 2>&1
          status=$?
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path('/tmp/coverage.txt').read_text()
          total = re.search(r'^TOTAL\s+\d+\s+\d+\s+(\d+)%$', text, flags=re.MULTILINE)
          failed = re.search(r'^FAILED\s+([^\s]+)', text, flags=re.MULTILINE)
          print(f"percent={total.group(1) if total else 'unknown'}")
          print(f"failure={failed.group(1).replace('::','__') if failed else 'none'}")
          PY
          exit $status
      - name: Coverage ${{ steps.coverage.outputs.percent }} percent failure ${{ steps.coverage.outputs.failure }}
        run: true
