name: Deep Audit

on:
  workflow_dispatch:
  push:
    branches: [audit-m14-deep-review]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project and audit tools
        run: |
          chmod +x install.sh
          ./install.sh
          .venv/bin/python -m pip install vulture pyright pip-audit coverage
      - name: Canonical compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests
      - name: Canonical Ruff
        run: .venv/bin/ruff check main.py config core ui tests
      - name: Canonical pytest
        run: .venv/bin/python -m pytest
      - name: Deprecation warnings as errors
        run: .venv/bin/python -W error::DeprecationWarning -m pytest
      - name: Vulture dead-code scan
        run: .venv/bin/vulture main.py config core ui --min-confidence 80
      - name: Pyright type scan
        run: .venv/bin/pyright main.py config core ui
      - name: Ruff ALL production scan
        run: .venv/bin/ruff check main.py config core ui --select ALL
      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Diagnose coverage pytest
        id: covdiag
        shell: bash
        run: |
          set +e
          .venv/bin/coverage run -m pytest -q > /tmp/coverage-pytest.txt 2>&1
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          output = Path("/tmp/coverage-pytest.txt").read_text()
          failures = re.findall(r"^FAILED\s+([^\s]+)", output, flags=re.MULTILINE)
          if failures:
              print(f"node={failures[0].replace('::', '__')}")
          else:
              print("node=clean")
          PY
      - name: Coverage pytest ${{ steps.covdiag.outputs.node }}
        if: steps.covdiag.outputs.node != 'clean'
        run: exit 1
      - name: Coverage report
        if: steps.covdiag.outputs.node == 'clean'
        run: .venv/bin/coverage report -m
