name: Deep Audit

on:
  workflow_dispatch:
  push:
    branches: [audit-m14-deep-review]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project and audit tools
        run: |
          chmod +x install.sh
          ./install.sh
          .venv/bin/python -m pip install vulture pyright pip-audit pytest-cov
      - name: Canonical compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests
      - name: Canonical Ruff
        run: .venv/bin/ruff check main.py config core ui tests
      - name: Canonical pytest
        run: .venv/bin/python -m pytest
      - name: Deprecation warnings as errors
        run: .venv/bin/python -W error::DeprecationWarning -m pytest

      - name: Diagnose Vulture
        id: vulture
        shell: bash
        run: |
          set +e
          .venv/bin/vulture main.py config core ui --min-confidence 80 > /tmp/vulture.txt 2>&1
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          lines = [line.strip() for line in Path('/tmp/vulture.txt').read_text().splitlines() if line.strip()]
          print(f"count={len(lines)}")
          if lines:
              first = lines[0].replace(' ', '_').replace(':', '-')[:160]
              print(f"first={first}")
          else:
              print("first=clean")
          PY
      - name: Vulture ${{ steps.vulture.outputs.count }} finding(s) first ${{ steps.vulture.outputs.first }}
        if: steps.vulture.outputs.count != '0'
        continue-on-error: true
        run: exit 1

      - name: Pyright type scan
        run: .venv/bin/pyright main.py config core ui
      - name: Ruff ALL production scan
        run: .venv/bin/ruff check main.py config core ui --select ALL
      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Coverage
        run: .venv/bin/python -m pytest --cov=main --cov=config --cov=core --cov=ui --cov-report=term-missing
