name: Deep Audit

on:
  workflow_dispatch:
  push:
    branches: [audit-m14-deep-review]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project and audit tools
        run: |
          chmod +x install.sh
          ./install.sh
          .venv/bin/python -m pip install vulture pyright pip-audit pytest-cov
      - name: Canonical compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests
      - name: Canonical Ruff
        run: .venv/bin/ruff check main.py config core ui tests
      - name: Canonical pytest
        run: .venv/bin/python -m pytest
      - name: Deprecation warnings as errors
        run: .venv/bin/python -W error::DeprecationWarning -m pytest

      - name: Vulture summary
        id: vulture
        shell: bash
        run: |
          set +e
          .venv/bin/vulture main.py config core ui --min-confidence 80 > /tmp/vulture.txt 2>&1
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          lines=[x.strip() for x in Path('/tmp/vulture.txt').read_text().splitlines() if x.strip()]
          print(f"count={len(lines)}")
          print(f"first={(lines[0].replace(' ','_').replace(':','-')[:120] if lines else 'clean')}")
          PY
      - name: Vulture ${{ steps.vulture.outputs.count }} first ${{ steps.vulture.outputs.first }}
        run: true

      - name: Pyright summary
        id: pyright
        shell: bash
        run: |
          set +e
          .venv/bin/pyright main.py config core ui --outputjson > /tmp/pyright.json
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from collections import Counter
          from pathlib import Path
          d=json.loads(Path('/tmp/pyright.json').read_text()).get('generalDiagnostics',[])
          c=Counter('core' if '/core/' in x.get('file','') else 'ui' if '/ui/' in x.get('file','') else 'config' if '/config/' in x.get('file','') else 'main' for x in d)
          print(f"count={len(d)}"); print(f"core={c['core']}"); print(f"ui={c['ui']}"); print(f"config={c['config']}"); print(f"main={c['main']}")
          PY
      - name: Pyright ${{ steps.pyright.outputs.count }} core ${{ steps.pyright.outputs.core }} ui ${{ steps.pyright.outputs.ui }} config ${{ steps.pyright.outputs.config }} main ${{ steps.pyright.outputs.main }}
        run: true

      - name: Ruff ALL summary
        id: ruffall
        shell: bash
        run: |
          set +e
          .venv/bin/ruff check main.py config core ui --select ALL --output-format=json > /tmp/ruffall.json
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/ruffall.json').read_text())
          print(f"count={len(d)}")
          print(f"first={(d[0]['code']+'-'+Path(d[0]['filename']).name+'-'+str(d[0]['location']['row']) if d else 'clean')}")
          PY
      - name: Ruff ALL ${{ steps.ruffall.outputs.count }} first ${{ steps.ruffall.outputs.first }}
        run: true

      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Coverage
        id: coverage
        shell: bash
        run: |
          .venv/bin/python -m pytest --cov=main --cov=config --cov=core --cov=ui --cov-report=term > /tmp/coverage.txt 2>&1
          .venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text=Path('/tmp/coverage.txt').read_text()
          total=re.search(r'^TOTAL\s+\d+\s+\d+\s+(\d+)%$',text,flags=re.MULTILINE)
          print(f"percent={total.group(1) if total else 'unknown'}")
          PY
      - name: Coverage ${{ steps.coverage.outputs.percent }} percent
        run: true
