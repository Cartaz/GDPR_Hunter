name: Audit Validation

on:
  workflow_dispatch:
  push:
    branches: [audit-m14-fixes]

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project and audit tools
        run: |
          chmod +x install.sh
          ./install.sh
          .venv/bin/python -m pip install pytest-cov vulture

      - name: Compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests

      - name: Ruff
        run: .venv/bin/ruff check main.py config core ui tests

      - name: Pytest
        run: .venv/bin/python -m pytest

      - name: Deprecations as errors
        run: .venv/bin/python -W error::DeprecationWarning -m pytest

      - name: Dead-code scan
        run: .venv/bin/vulture main.py config core ui --min-confidence 80 --ignore-names navigation_type

      - name: Dependency audit
        run: .venv/bin/pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Coverage
        run: .venv/bin/python -m pytest --cov=main --cov=config --cov=core --cov=ui --cov-report=term-missing
